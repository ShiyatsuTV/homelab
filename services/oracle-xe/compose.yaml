services:
  oracle-db:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-db
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?set ORACLE_PWD in .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped

volumes:
  oracle-data:
